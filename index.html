<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&amp;family=Nunito:wght@400;700&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Educa+ | Criar uma conta</title></head>
<body>
<header><p class="logo">Educa<span>+</span></p><nav aria-label="Menu principal"><ul><li><a href="principal.html">Início</a></li><li><a href="index.html">Criar uma conta</a></li><li><a href="login.html">Já sou participante</a></li></ul></nav></header>
<main>
<form class="form-caixa" action="login.html" method="get">
<h1>Crie sua conta</h1>
<p>Cadastre-se para dar ou receber aulas de reforço.</p>
<label for="nome">Nome completo</label><input type="text" id="nome" name="nome" required>
<label for="email">E-mail</label><input type="email" id="email" name="email" required>
<label for="nasc">Data de nascimento</label><input type="date" id="nasc" name="nasc" required>
<label for="perfil">Quero</label>
<select id="perfil" name="perfil" required><option value="">Escolha uma opção</option><option>Dar aulas de reforço</option><option>Receber aulas de reforço</option></select>
<label for="senha">Senha</label><input type="password" id="senha" name="senha" minlength="6" required>
<button class="botao" type="submit">Criar conta</button>
<p>Já tem conta? <a href="login.html">Entrar</a></p>
</form>
</main>
<footer><p class="logo">Educa<span>+</span></p><p>Projeto 1 - Programação Web Front-End</p><p class="autor">Por <a href="https://adaniellalima.github.io/frontend_dani/">Daniella Lima</a></p></footer>
</body>
</html>
